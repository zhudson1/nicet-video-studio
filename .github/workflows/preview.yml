name: NICET video production drafts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render.py'
      - 'content/episode.txt'
      - '.github/workflows/preview.yml'
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install Pillow==11.3.0
      - name: Render technical proof of concept (not approved for publishing)
        run: |
          python scripts/render.py
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 output/preview.mp4 | grep -q '720,1280'
      - name: Upload review artifact (NOT PUBLISHED)
        uses: actions/upload-artifact@v4
        with:
          name: nicet-review-draft
          path: output/preview.mp4
          retention-days: 14
